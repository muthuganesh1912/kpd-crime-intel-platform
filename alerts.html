<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alerts — KSP Crime Intelligence Platform</title>
<style>
  :root{
    --navy:#0b1220; --blue:#2f5fe0; --blue-light:#eaf0ff;
    --text:#1c2333; --muted:#6b7280; --border:#e7eaf0; --bg:#f6f7fb;
    --high:#e0432f; --high-bg:#fdeceb; --medium:#e0a52f; --medium-bg:#fdf3e3;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;margin:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
  .layout{display:flex;height:100vh;}
  .sidebar{width:230px;background:var(--navy);color:#cbd3e6;flex-shrink:0;padding:20px 0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid #1c2740;margin-bottom:10px;}
  .brand-badge{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .brand-badge img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:13px;line-height:1.2;margin:0;color:#fff;}
  .brand span{font-size:10px;color:#8a93ab;}
  .nav{display:flex;flex-direction:column;padding:10px;}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#aab3cc;text-decoration:none;font-size:13px;margin-bottom:2px;}
  .nav a.active{background:var(--blue);color:#fff;}
  .nav a:hover:not(.active){background:#161f38;}

  .main{flex:1;padding:24px 28px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .topbar h2{margin:0;font-size:22px;}
  .topbar p{margin:2px 0 0;color:var(--muted);font-size:13px;}

  .summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0;flex-shrink:0;}
  .summary-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;}
  .summary-card .label{font-size:11px;color:var(--muted);}
  .summary-card .value{font-size:22px;font-weight:700;margin-top:4px;}
  .summary-card.high .value{color:var(--high);}
  .summary-card.medium .value{color:var(--medium);}

  .filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0;flex-wrap:wrap;}
  .filter-chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--muted);}
  .filter-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}

  .alert-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .alert-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;}
  .alert-card.High{border-left-color:var(--high);}
  .alert-card.Medium{border-left-color:var(--medium);}
  .alert-main{flex:1;}
  .alert-title{font-size:13px;font-weight:600;margin-bottom:4px;}
  .alert-desc{font-size:12px;color:var(--muted);line-height:1.5;}
  .alert-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--blue-light);color:var(--blue);font-weight:600;}
  .badge{font-size:10px;padding:3px 10px;border-radius:10px;font-weight:700;flex-shrink:0;}
  .badge.High{background:var(--high-bg);color:var(--high);}
  .badge.Medium{background:var(--medium-bg);color:var(--medium);}

  .loading{color:var(--muted);font-size:13px;padding:30px;text-align:center;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge"><img src="Seal_of_Karnataka.svg" alt="Karnataka State Emblem"></div>
      <div><h1>KARNATAKA<br>STATE POLICE</h1><span>Crime Intelligence Platform</span></div>
    </div>
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
<a href="crime_analytics.html">Crime Analytics</a>
<a href="hotspot_map.html">Hotspot Map</a>
<a href="network_analysis.html">Network Analysis</a>
<a href="case_explorer.html">Case Explorer</a>
<a href="ai_assistant.html">AI Crime Assistant</a>
<a href="reports.html">Reports</a>
<a href="alerts.html">Alerts</a>
<a href="#">Settings</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2>Alerts</h2>
      <p id="subtitle">Loading live data from Catalyst…</p>
    </div>

    <div class="summary-row" id="summaryRow">
      <div class="summary-card"><div class="label">Total Alerts</div><div class="value">–</div></div>
    </div>

    <div class="filter-bar" id="filterBar">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="High">High Severity</button>
      <button class="filter-chip" data-filter="Medium">Medium Severity</button>
      <button class="filter-chip" data-filter="pending_investigation">Pending Investigations</button>
      <button class="filter-chip" data-filter="crime_spike">Crime Spikes</button>
      <button class="filter-chip" data-filter="repeat_offender">Repeat Offenders</button>
    </div>

    <div class="alert-list" id="alertList"><div class="loading">Loading…</div></div>
  </main>
</div>

<script>
const API_URL = "https://kpd-crime-intel-platform-60075058456.development.catalystserverless.in/server/alerts/";
let allAlerts = [];
let activeFilter = 'all';

const typeLabel = {
  pending_investigation: 'Pending Investigation',
  crime_spike: 'Crime Spike',
  repeat_offender: 'Repeat Offender'
};

async function loadAlerts(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    if(data.status !== 'success') throw new Error(data.error || 'Unknown error');
    allAlerts = data.alerts;
    renderSummary(data.summary);
    renderAlerts();
    document.getElementById('subtitle').textContent = `${data.summary.total} active alert(s) across Karnataka`;
  }catch(err){
    document.getElementById('subtitle').textContent = "Could not load live data: " + err.message;
    document.getElementById('alertList').innerHTML = '<div class="loading">Failed to load. Is `catalyst serve` running?</div>';
  }
}

function renderSummary(s){
  const cards = [
    { label: 'Total Alerts', value: s.total, cls: '' },
    { label: 'High Severity', value: s.high, cls: 'high' },
    { label: 'Medium Severity', value: s.medium, cls: 'medium' },
    { label: 'Pending Investigations', value: s.pendingInvestigations, cls: '' },
    { label: 'Crime Spikes', value: s.crimeSpikes, cls: '' }
  ];
  document.getElementById('summaryRow').innerHTML = cards.map(c => `
    <div class="summary-card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>
  `).join('');
}

document.getElementById('filterBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-chip');
  if (!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b === btn));
  renderAlerts();
});

function renderAlerts(){
  let filtered = allAlerts;
  if (activeFilter !== 'all'){
    filtered = allAlerts.filter(a => a.severity === activeFilter || a.type === activeFilter);
  }
  if (filtered.length === 0){
    document.getElementById('alertList').innerHTML = '<div class="loading">No alerts match this filter.</div>';
    return;
  }
  document.getElementById('alertList').innerHTML = filtered.map(a => `
    <div class="alert-card ${a.severity}">
      <div class="alert-main">
        <div class="alert-title">${a.title}</div>
        <div class="alert-desc">${a.description}</div>
        <div class="alert-meta">
          <span class="tag">${typeLabel[a.type] || a.type}</span>
          ${a.district ? `<span class="tag">${a.district}</span>` : ''}
        </div>
      </div>
      <span class="badge ${a.severity}">${a.severity}</span>
    </div>
  `).join('');
}

loadAlerts();
</script>
</body>
</html>
